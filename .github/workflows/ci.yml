name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install infrastructure dependencies
        run: npm ci --prefix infra
      - name: Test local monitoring logic
        run: npm test
      - name: Test infrastructure
        run: npm --prefix infra test
      - name: Type-check infrastructure
        run: npm run infra:build
      - name: Synthesize CloudFormation
        run: npm run infra:synth
